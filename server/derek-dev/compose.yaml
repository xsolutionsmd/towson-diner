name: towson-diner-derek-dev
services:
  web:
    image: ${APP_IMAGE:?Set the approved immutable application image}
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp, /data, /config]
    security_opt: [no-new-privileges:true]
    environment:
      APP_ENVIRONMENT: derek-dev
    networks:
      proxy:
        aliases: [towson-diner-derek-dev]
    logging:
      options:
        max-size: "5m"
        max-file: "2"
networks:
  proxy:
    external: true
    name: xsolutions-proxy
